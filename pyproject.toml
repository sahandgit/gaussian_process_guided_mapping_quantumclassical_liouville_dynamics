[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-mqcld"
version = "0.1.0"
description = "Gaussian-process-based mapping quantum-classical Liouville dynamics with GP/RKHS density surrogates, PBME-MInt transport, midpoint QCLE corrections, and Tully-model benchmarks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sahand Nikzat"}]
license = {text = "MIT"}
keywords = ["quantum-classical dynamics", "QCLE", "PBME", "Gaussian process", "mapping basis", "Liouville dynamics", "Tully model", "scientific computing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "torch>=2.0",
  "jax>=0.4",
  "jaxlib>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5"]

[project.scripts]
gp-mqcld = "gp_mint_qcle.cli:main"
gp-mqcld-run = "gp_mint_qcle.run:main"
gp-mqcld-compare = "gp_mint_qcle.Compare_gp_se_qcle:main"
gp-mqcld-smoke = "gp_mint_qcle.cli_smoke:main"
# Backward-compatible aliases for previous notes/scripts
liouvillegp = "gp_mint_qcle.cli:main"
liouvillegp-run = "gp_mint_qcle.run:main"
liouvillegp-compare = "gp_mint_qcle.Compare_gp_se_qcle:main"
liouvillegp-smoke = "gp_mint_qcle.cli_smoke:main"
gp-mint = "gp_mint_qcle.cli:main"
gp-mint-run = "gp_mint_qcle.run:main"
gp-mint-compare = "gp_mint_qcle.Compare_gp_se_qcle:main"
gp-mint-smoke = "gp_mint_qcle.cli_smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
